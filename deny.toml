# ============================================================
# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
# ============================================================

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

# ============================================================
# ЛИЦЕНЗИИ
# ============================================================
[licenses]
version = 2
confidence-threshold = 0.8

# Разрешённые лицензии (permissive, для open-source)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "0BSD",
]

# Copyleft лицензии — исключения (только для build-deps)
exceptions = [
    # ring использует свою лицензию
    { allow = ["OpenSSL"], name = "ring" },
    # webpki — ISC-style
    { allow = ["ISC"], name = "webpki-roots" },
]

# Приватные пакеты (не публикуются)
private = { ignore = true }

# ============================================================
# УЯЗВИМОСТИ
# ============================================================
[advisories]
version = 2
ignore = [
    # Пример: игнорировать конкретные RUSTSEC-XXXX
    # "RUSTSEC-2024-0001",
]
# Не падать на yanked-крейтах
yanked = "warn"

# ============================================================
# БАНЫ (запрещённые крейты и дубликаты)
# ============================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Запрещённые крейты
deny = [
    # openssl — используем rustls где можно
    # { name = "openssl" },
]

# Разрешённые дубликаты (по имени)
skip = [
    # Пример: разные версии syn допустимы
    # { name = "syn", version = "=1.0.109" },
]

# Несколько версий одного крейта — предупреждение, не ошибка
# (потому что у нас много Solana-зависимостей)

# ============================================================
# ИСТОЧНИКИ
# ============================================================
[sources]
unknown-registry = "warn"
unknown-git = "warn"

# Разрешённые git-источники (для Solana-форков)
allow-git = [
    # Мы не используем git-зависимости напрямую
]
