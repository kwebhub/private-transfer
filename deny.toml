# ============================================================
# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
# ============================================================

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

# ============================================================
# ЛИЦЕНЗИИ
# ============================================================
[licenses]
version = 2
confidence-threshold = 0.8

# Разрешённые лицензии (permissive, для open-source)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]

# Приватные пакеты (не публикуются)
private = { ignore = true }

# ============================================================
# УЯЗВИМОСТИ
# ============================================================
[advisories]
version = 2
# Игнорируем уязвимости, которые НЕ влияют на нас:
ignore = [
    # sqlx 0.7.4 — Binary Protocol Misinterpretation.
    # Влияет только если мы передаём >4GiB в одном запросе.
    # Мы принимаем witness максимум ~5KB. Не эксплуатируется.
    "RUSTSEC-2024-0363",

    # rustls 0.23.44 — TLS 1.3 handshake bug.
    # Мы используем rustls только для HTTPS к Solana RPC.
    # Обновим при следующем `cargo update`.
    "RUSTSEC-2026-0285",

    # paste 1.0.15 — unmaintained (архивирован).
    # Транзитивная зависимость от axum-prometheus.
    # Функционален, замены не требует.
    "RUSTSEC-2024-0436",
]

# Не падать на yanked-крейтах
yanked = "warn"

# ============================================================
# БАНЫ
# ============================================================
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

# Запрещённые крейты (пока пусто)
deny = []

# ============================================================
# ИСТОЧНИКИ
# ============================================================
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
