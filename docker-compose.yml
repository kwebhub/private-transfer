services:
  solana-dev:
    build: .
    container_name: solana-dev
    stdin_open: true
    tty: true
    user: "1000:1000"
    working_dir: /home/ubuntu/workspace
    volumes:
      - ./workspace:/home/ubuntu/workspace
      - ./solana:/home/ubuntu/.config/solana
    deploy:
      resources:
        limits:
          cpus: "6.00"
          memory: 8g
    environment:
      - CARGO_TERM_COLOR=always
    network_mode: host

  postgres:
    image: postgres:16-alpine
    container_name: ptrans-postgres
    environment:
      POSTGRES_USER: ptrans
      POSTGRES_PASSWORD: ptrans_dev_password
      POSTGRES_DB: ptrans
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ptrans-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ptrans-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ptrans-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
