[package]
name = "ptrans-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"

[dependencies]
# HTTP-сервер
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Конфигурация
dotenvy = "0.15"
anyhow = "1.0"

# База данных
sqlx = { version = "0.7", default-features = false, features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "uuid",
  "chrono",
] }
redis = { version = "0.25", features = ["tokio-comp", "ahash"] }

# Утилиты
hex = "0.4"
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }

# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP-клиент для вызова prover
reqwest = { version = "0.12", features = ["json"] }

[workspace]
