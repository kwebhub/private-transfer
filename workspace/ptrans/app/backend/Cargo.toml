[package]
name = "ptrans-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# HTTP-сервер
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Конфигурация
dotenvy = "0.15"
anyhow = "1.0"

# База данных
sqlx = { version = "0.7", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "uuid",
  "chrono",
] }
redis = { version = "0.25", features = ["tokio-comp", "ahash"] }

# Криптография
ark-bn254 = "0.4"
ark-ff = "0.4"
poseidon-rs = "0.0.10"
hex = "0.4"
bs58 = "0.5"
base64 = "0.21"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
sha2 = "0.10"

# Solana
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"

# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"
